name: Publish Macro Report

on:
  # Daily at 18:00 CET. CET is UTC+1 (UTC+2 during CEST). GitHub Actions
  # cron runs in UTC, so 17:00 UTC == 18:00 CET / 19:00 CEST. This keeps the
  # run close to 6 PM local time year-round.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      report_type:
        description: Report type to generate
        type: choice
        default: daily
        options:
          - daily
          - weekly
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-report.yml

# Permissions required by actions/deploy-pages to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Materialize API keys
        run: |
          mkdir -p api_keys
          for service in FRED FMP GDELT; do
            var_name="${service}_API_KEY"
            value="${!var_name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" > "api_keys/${service}.txt"
              echo "Configured ${service} API key"
            else
              echo "No ${service} API key secret provided"
            fi
          done
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GDELT_API_KEY: ${{ secrets.GDELT_API_KEY }}

      - name: Fetch data and generate report
        run: |
          python scripts/fetch_openbb.py
          python scripts/fetch_all.py
          python scripts/generate_report.py --type "${REPORT_TYPE}" --output html
        env:
          REPORT_TYPE: ${{ github.event.inputs.report_type || 'daily' }}

      - name: Stage report as index.html
        # GitHub Pages serves index.html at the site root; the report is
        # generated as reports/<type>_report.html, so copy it to index.html.
        run: cp "reports/${REPORT_TYPE}_report.html" reports/index.html
        env:
          REPORT_TYPE: ${{ github.event.inputs.report_type || 'daily' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove stale Pages artifacts
        # actions/deploy-pages fails if more than one "github-pages" artifact
        # exists for the run (e.g. after a re-run). Delete any pre-existing
        # ones before uploading a fresh artifact.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          ids=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' || true)
          for id in $ids; do
            echo "Deleting stale github-pages artifact: $id"
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the generated HTML report as the GitHub Pages site root.
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
